# Workshop dashboard (packages/dashboard) in cloud mode: attendees sign up with the room code, get a
# seat, and the dashboard's server routes proxy to that seat over the private network.
# Secrets set by room.sh deploy-dashboard: ROOM_MONGODB_URI, SESSION_SECRET, ROOM_CODE, FACILITATOR_EMAILS.
app = "chanl-eval-lab"
primary_region = "ewr"

[env]
  CHANL_EVAL_MODE = "cloud"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on for the workshop day: a cold start on the first signup is what attendees would see.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
